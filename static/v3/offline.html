<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111827">
    <title>fee[dB]ack is offline</title>
    <style>
        :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 2rem;
            background: #111827;
            color: #f8fafc;
        }
        main { width: min(32rem, 100%); }
        .brand { margin: 0 0 2.5rem; color: #22d3ee; font-size: 1rem; font-weight: 800; }
        h1 { margin: 0; font-size: clamp(1.8rem, 7vw, 2.6rem); line-height: 1.1; }
        p { margin: 1rem 0 0; color: #cbd5e1; font-size: 1rem; line-height: 1.6; }
        button {
            margin-top: 1.75rem;
            min-height: 3rem;
            padding: 0.75rem 1.25rem;
            border: 0;
            border-radius: 0.5rem;
            background: #22d3ee;
            color: #082f49;
            font: inherit;
            font-weight: 800;
            cursor: pointer;
        }
        button:focus-visible { outline: 3px solid #facc15; outline-offset: 3px; }
    </style>
</head>
<body>
    <main>
        <p class="brand">fee[dB]ack</p>
        <h1>Can't reach your fee[dB]ack server</h1>
        <p>This device may be offline, or the server may be unavailable. This does not mean your songs or profile data were lost.</p>
        <button type="button" id="retry">Retry</button>
    </main>
    <script>
        document.getElementById('retry').addEventListener('click', function () {
            window.location.reload();
        });
    </script>
</body>
</html>
