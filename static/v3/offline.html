<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <title>fee[dB]ack offline</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            --fb-bg: #0f172a;
            --fb-sidebar: #111827;
            --fb-card: #1e293b;
            --fb-card-muted: #0b1220;
            --fb-border: #334155;
            --fb-text: #f8fafc;
            --fb-text-dim: #94a3b8;
            --fb-primary: #0ea5e9;
            --fb-primary-hi: #38bdf8;
            --fb-danger: #ef4444;
            --fb-gold: #e8c040;
            background: var(--fb-bg);
            color: var(--fb-text);
        }
        * { box-sizing: border-box; }
        [hidden] { display: none !important; }
        body { min-height: 100vh; min-height: 100dvh; margin: 0; background: var(--fb-bg); }
        button { min-height: 2.75rem; font: inherit; font-size: 0.875rem; font-weight: 800; cursor: pointer; }
        button:focus-visible { outline: 3px solid var(--fb-primary-hi); outline-offset: 2px; }
        button:disabled { cursor: wait; opacity: 0.65; }
        .shell {
            width: min(72rem, 100%);
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0 auto;
            padding: env(safe-area-inset-top) env(safe-area-inset-right)
                env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        .topbar {
            position: sticky;
            top: 0;
            z-index: 2;
            display: flex;
            min-height: 4rem;
            align-items: center;
            gap: 1rem;
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--fb-border);
            background: var(--fb-sidebar);
            backdrop-filter: blur(18px);
        }
        .brand { margin: 0; color: var(--fb-text); font-weight: 800; }
        .status { min-width: 0; margin-right: auto; color: var(--fb-gold); font-size: 0.8125rem; font-weight: 700; }
        .retry, .primary, .secondary {
            border: 1px solid transparent;
            border-radius: 0.375rem;
            padding: 0.5rem 0.75rem;
        }
        .retry, .primary { background: var(--fb-primary); color: #082f49; }
        .retry:hover, .primary:hover { background: var(--fb-primary-hi); }
        .secondary {
            border-color: var(--fb-border);
            background: var(--fb-card-muted);
            color: var(--fb-text);
        }
        .secondary:hover { border-color: var(--fb-text-dim); }
        .danger { border-color: var(--fb-danger); color: #fecaca; }
        main { padding: 1.5rem 1rem 3rem; }
        h1 { margin: 0; font-size: 1.5rem; line-height: 1.2; }
        p { margin: 0.5rem 0 0; color: var(--fb-text-dim); line-height: 1.5; }
        .intro { max-width: 40rem; }
        .manager { margin-top: 1.25rem; }
        .summary { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.35rem 0.75rem; }
        .summary strong { color: var(--fb-text); font-size: 1.125rem; }
        .summary span { color: var(--fb-text-dim); font-size: 0.875rem; }
        .package-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 13rem), 1fr));
            gap: 1rem;
            margin: 1rem 0 0;
            padding: 0;
            list-style: none;
        }
        .package-card {
            display: grid;
            grid-template-rows: auto minmax(5.25rem, 1fr) auto;
            min-width: 0;
            overflow: hidden;
            border: 1px solid var(--fb-border);
            border-radius: 0.5rem;
            background: var(--fb-card);
        }
        .package-artwork {
            position: relative;
            display: grid;
            width: 100%;
            aspect-ratio: 1;
            place-items: center;
            overflow: hidden;
            background: var(--fb-card-muted);
        }
        .package-artwork-image { width: 100%; height: 100%; object-fit: cover; }
        .package-artwork-fallback {
            width: 36%;
            aspect-ratio: 1;
            border: 2px solid var(--fb-border);
            border-radius: 50%;
            box-shadow: inset 0 0 0 0.65rem var(--fb-card-muted), inset 0 0 0 0.8rem var(--fb-text-dim);
        }
        .package-details { display: grid; min-width: 0; align-content: start; gap: 0.2rem; padding: 0.875rem; }
        .package-title { overflow-wrap: anywhere; }
        .package-artist { overflow: hidden; color: var(--fb-text-dim); font-size: 0.875rem; text-overflow: ellipsis; white-space: nowrap; }
        .package-meta { color: var(--fb-text-dim); font-size: 0.8125rem; }
        .package-actions { display: flex; gap: 0.5rem; padding: 0 0.875rem 0.875rem; }
        .package-actions button { flex: 1 1 0; min-width: 0; }
        .empty {
            margin-top: 1rem;
            border: 1px solid var(--fb-border);
            border-radius: 0.5rem;
            padding: 1rem;
            background: var(--fb-card-muted);
            color: var(--fb-text-dim);
        }
        .error {
            margin-top: 1rem;
            border: 1px solid var(--fb-danger);
            border-radius: 0.5rem;
            padding: 0.875rem;
            background: rgba(127, 29, 29, 0.3);
            color: #fecaca;
        }
        @media (max-width: 36rem) {
            main { padding-top: 1.5rem; }
            .package-list { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.75rem; }
            .package-details { padding: 0.75rem; }
            .package-actions { padding: 0 0.75rem 0.75rem; }
            .package-actions button { min-height: 2.75rem; padding: 0.375rem; }
        }
        @media (max-width: 23rem) {
            .package-list { grid-template-columns: minmax(0, 1fr); }
        }
    </style>
</head>
<body>
    <div class="shell">
        <header class="topbar">
            <p class="brand">fee[dB]ack</p>
            <span class="status">Server unavailable</span>
            <button type="button" class="retry" id="retry">Retry</button>
        </header>
        <main>
            <section class="intro" aria-labelledby="offline-title">
                <h1 id="offline-title">Offline practice</h1>
                <p>Open downloaded songs while your server is unavailable.</p>
            </section>
            <p id="offline-storage-loading">Checking downloaded songs...</p>
            <section class="manager" id="offline-package-manager" hidden aria-live="polite">
                <div class="summary">
                    <strong id="offline-package-count"></strong>
                    <span id="offline-storage-usage"></span>
                </div>
                <ul class="package-list" id="offline-package-list"></ul>
                <p class="empty" id="offline-package-empty" hidden>No songs are downloaded for offline practice yet.</p>
                <p class="error" id="offline-storage-error" hidden></p>
            </section>
        </main>
    </div>
    <script>
        document.getElementById('retry').addEventListener('click', function () {
            window.location.assign('/v3/');
        });
    </script>
    <script type="module" src="/static/v3/offline-catalog.js"></script>
</body>
</html>
